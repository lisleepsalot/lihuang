<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Render Test</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    body {
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <button id="renderBtn">Render Test Project</button>
  <div id="output"></div>

  <script type="module">
    import {buildProjectHTML} from './Renderprojectclient.js'

    // Fetches projects.json (created by fetchProjects.js) and renders the
    // first project into #output. Only runs when the button is clicked.
    async function renderTestProject() {
      const response = await fetch('projects.json')
      const projects = await response.json()
      document.getElementById('output').innerHTML = buildProjectHTML(projects[0])
    }

    document.getElementById('renderBtn').addEventListener('click', renderTestProject)
  </script>
</body>
</html>
