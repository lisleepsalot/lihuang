<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Li</title>
    <style>

        @font-face 
        {
	        font-family: 'Heap';
	        src: url('./Heap-Regular.woff2') format('woff2'); /* Reference the font file */
	        font-weight: normal;
	        font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Heap';
            font-size: 12px;
            overflow: hidden;
        }

        .viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        .grid-container {
            position: absolute;
            transition: transform 1.5s ease;
        }
        
        .grid-cell {
            width: 680px;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .display-grid-container{
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .display-grid-image {
            width: 570px;
            height: 380px;
            background-image: url('./placeholder.jpeg');
            background-size: cover;
            background-position: center;
        }
        
        .display-grid-textbox {
            width: 570px;
            display: flex;
            justify-content: space-between;
            padding-top: 4px;
            padding-bottom: 4px;
            border-top: 1px dotted black;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .grid-cell.active .display-grid-textbox {
            opacity: 1;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 250px;
            z-index: 1000;
        }

        .control-panel button {
            width: 50px;
            height: 50px;
            font-family: 'Heap';
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="control-panel" id="controlPanel"></div>
    <div class="viewport">
        <div class="grid-container" id="gridContainer"></div>
    </div>
    
    <script>
        const projects = [
            { name: "name 1", year: "year 1" },
            { name: "name 2", year: "year 2" },
            { name: "name 3", year: "year 3" },
            { name: "name 4", year: "year 4" },
            { name: "name 5", year: "year 5" },
            { name: "name 6", year: "year 6" },
            { name: "name 7", year: "year 7" },
            { name: "name 8", year: "year 8" },
            { name: "name 9", year: "year 9" },
            { name: "name 10", year: "year 10" },
            { name: "name 11", year: "year 11" },
            { name: "name 12", year: "year 12" },
            { name: "name 13", year: "year 13" },
            { name: "name 14", year: "year 14" },
            { name: "name 15", year: "year 15" },
            { name: "name 16", year: "year 16" },
            { name: "name 17", year: "year 17" },
            { name: "name 18", year: "year 18" },
            { name: "name 19", year: "year 19" },
            { name: "name 20", year: "year 20" }
        ];
        
        // Calculate how many border items needed for complete surrounding layer
        // Add enough border items to complete at least 2 more full spiral layers
        const regularCount = projects.length;
        
        // Calculate which positions would form a complete surrounding border
        // We'll add items until we have at least 2 complete layers beyond the last regular item
        let currentTotal = regularCount;
        let steps = Math.ceil(Math.sqrt(currentTotal)); // rough estimate of current radius
        
        // Add 2 complete spiral layers worth of items to ensure full coverage
        const layerSize1 = (steps * 2) * 4; // perimeter of next layer
        const layerSize2 = ((steps + 1) * 2) * 4; // perimeter of layer after that
        const borderItemsNeeded = layerSize1 + layerSize2;
        
        for (let i = 0; i < borderItemsNeeded; i++) {
            projects.push({ name: "", year: "", isBorder: true });
        }
        
        const gridContainer = document.getElementById('gridContainer');
        const controlPanel = document.getElementById('controlPanel');
        
        // Generate spiral coordinates starting from center (4,4)
        function generateSpiralCoordinates(count) {
            const coords = [];
            let x = 4, y = 4; // Start at center (using 1-based indexing internally)
            coords.push({x, y});
            
            let steps = 1;
            let direction = 0; // 0: right, 1: up, 2: left, 3: down
            
            while (coords.length < count) {
                for (let i = 0; i < 2; i++) {
                    for (let j = 0; j < steps; j++) {
                        if (coords.length >= count) break;
                        
                        // Move in current direction
                        if (direction === 0) x++; // right
                        else if (direction === 1) y--; // up
                        else if (direction === 2) x--; // left
                        else if (direction === 3) y++; // down
                        
                        coords.push({x, y});
                    }
                    direction = (direction + 1) % 4;
                    if (coords.length >= count) break;
                }
                steps++;
            }
            
            return coords;
        }
        
        const spiralCoords = generateSpiralCoordinates(projects.length);
        const gridCells = [];
        
        // Create grid cells and position them according to spiral
        projects.forEach((project, index) => {
            const gridCell = document.createElement('div');
            gridCell.className = 'grid-cell';
            
            const coord = spiralCoords[index];
            // Convert to 0-based and position absolutely
            gridCell.style.position = 'absolute';
            gridCell.style.left = `${(coord.x - 1) * 680}px`;
            gridCell.style.top = `${(coord.y - 1) * 500}px`;
            
            if (project.isBorder) {
                // Border items: just outline box, no image, no text
                gridCell.innerHTML = `
                    <div class="display-grid-container">
                        <div class="display-grid-image" style="background-image: none; background-color: transparent; border: 1px dashed black;"></div>
                    </div>
                `;
            } else {
                // Regular items
                gridCell.innerHTML = `
                    <div class="display-grid-container">
                        <div class="display-grid-image" style="background-image: url('./placeholder.jpeg');"></div>
                        <div class="display-grid-textbox">
                            <span>${project.name}</span>
                            <span>${project.year}</span>
                        </div>
                    </div>
                `;
            }
            
            gridContainer.appendChild(gridCell);
            gridCells.push({element: gridCell, coord: coord});
        });

        // Generate control panel buttons only for non-border items
        const nonBorderCount = projects.filter(p => !p.isBorder).length;
        for (let i = 1; i <= nonBorderCount; i++) {
            const button = document.createElement('button');
            button.textContent = i;
            button.addEventListener('click', () => navigateToGrid(i));
            controlPanel.appendChild(button);
        }

        // Function to center a specific grid item
        function navigateToGrid(index) {
            // Remove active class from all cells
            gridCells.forEach(cell => {
                cell.element.classList.remove('active');
            });
            
            const cellData = gridCells[index - 1];
            const coord = cellData.coord;
            
            // Add active class to the centered cell
            cellData.element.classList.add('active');
            
            // Calculate position of the grid item (0-based pixels)
            const itemX = (coord.x - 1) * 680;
            const itemY = (coord.y - 1) * 500;
            
            // Calculate viewport center
            const viewportCenterX = window.innerWidth / 2;
            const viewportCenterY = window.innerHeight / 2;
            
            // Calculate grid item center
            const itemCenterX = itemX + 340; // 680/2
            const itemCenterY = itemY + 250; // 500/2
            
            // Calculate translation needed to center the item
            const translateX = viewportCenterX - itemCenterX;
            const translateY = viewportCenterY - itemCenterY;
            
            gridContainer.style.transform = `translate(${translateX}px, ${translateY}px)`;
        }

        // Initialize by centering the first item (center of spiral)
        navigateToGrid(1);
    </script>
</body>
</html>
