<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Random Image with Blur Effect</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }
    img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      transition: filter 0.3s ease-in-out;
    }
  </style>
</head>
<body>
  <img class="blurry-image" data-src="https://picsum.photos/3840/2160" alt="Random image">

  <!-- BlurryImageLoader library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/blurry-image-loader@latest"></script>
  
  <script>
    // Load all images with blur effect
    BlurryImageLoader.loadAllImagesWithBlur('.blurry-image');
  </script>
</body>
</html>
