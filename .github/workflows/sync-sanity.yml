# Refreshes projects.json from Sanity and commits it, so the live site picks
# up CMS edits without anyone running fetchProjects.js by hand. Triggered by a
# Sanity webhook (repository_dispatch "sanity-update"), or manually from the
# Actions tab.
name: Sync Sanity content

on:
  repository_dispatch:
    types: [sanity-update]
  workflow_dispatch:

# Back-to-back publishes fire several webhooks; let them queue instead of
# racing each other to push.
concurrency:
  group: sync-sanity
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run fetch

      - name: Commit projects.json if it changed
        run: |
          if git diff --quiet -- projects.json; then
            echo "projects.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "Sync projects.json from Sanity"
          git push
